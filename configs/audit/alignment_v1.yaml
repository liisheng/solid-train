# Frozen alignment checklist (Plan Sections 2.1, 13, 16-17).
#
# FROZEN: this file is pinned by a SHA-256 digest in
# src/tinybench_lm/alignment.py (FROZEN_ALIGNMENT_PROTOCOL_SHA256). Loading fails closed if the
# bytes change. Any change must be published as configs/audit/alignment_v2.yaml with a recorded
# reason; never edit v1 in place.
#
# This is the repository's own answer to "is it aligned with the authoritative plan?" It is a
# checklist, not a narrative: every entry names a thing to check and the auditor either
# satisfies it or reports an unexplained difference. Two rules make the answer trustworthy.
#
# First, an unexplained difference always fails. The only permitted non-pass is a DEFERRED entry
# whose category is one of the five things a repository genuinely cannot settle by itself
# (`deferral_policy.allowed_categories`), and even then only when it names an owner and a next
# action. "We'll get to it" is not a category.
#
# Second, the audit is read-only. It opens files, computes digests, and calls verifiers; it
# never writes, formats, or repairs anything. That is what makes running it twice meaningful:
# a second run must produce the identical report and leave every byte untouched.
#
# This checklist complements tests/test_alignment_audit.py rather than replacing it. That file
# holds the task-1 bug-condition property and its deterministic counterexamples, and task 3.21
# re-runs it unchanged.

protocol: alignment_audit
version: v1
frozen: true
calibration: repository-state-only-read-only
consumes: every frozen protocol under configs/, the verifier modules under src/tinybench_lm/, and configs/release/evidence_matrix_v1.yaml

change_control:
  immutable: true
  on_change: create configs/audit/alignment_v2.yaml and record the reason
  hash_algorithm: sha256
  hash_scope: file bytes with CRLF normalized to LF
  hash_registry: src/tinybench_lm/alignment.py::FROZEN_ALIGNMENT_PROTOCOL_SHA256

audit_policy:
  read_only: true
  # Running the audit twice must return the same report and rewrite nothing.
  idempotent: true
  unexplained_difference_fails: true
  statuses: [PASS, FAIL, DEFERRED]
  reason_code_on_unexplained_difference: AUDIT_UNEXPLAINED_DIFFERENCE
  reason_code_on_mutation: AUDIT_MUTATED_REPOSITORY

deferral_policy:
  # The only five things this repository cannot settle on its own.
  allowed_categories:
    - measurement
    - organizer_answer
    - personal_attestation
    - public_release
    - long_running_campaign
  requires_owner: true
  requires_next_action: true
  reason_code_on_unnamed_category: AUDIT_DEFERRAL_CATEGORY_INVALID
  reason_code_on_missing_detail: AUDIT_DEFERRAL_DETAIL_INCOMPLETE

