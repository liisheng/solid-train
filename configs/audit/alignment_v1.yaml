# --------------------------------------------------------------------------------------
# Explicit deferrals. Each names its category, owner, and next action.
# --------------------------------------------------------------------------------------

deferrals:
  - entry_id: deferred.hardware_measurement
    category: measurement
    requirement: Section 9.1 hardware promotion measurements on both machines
    owner: operator
    next_action: run the hardware inventory and sustained real-shard throughput measurement, then record them
  - entry_id: deferred.corpus_acquisition
    category: long_running_campaign
    requirement: real corpus acquisition, dedup, decontamination, and shard production
    owner: operator
    next_action: complete the G1 data pipeline on real sources and record the manifests
  - entry_id: deferred.proxy_campaign
    category: long_running_campaign
    requirement: P1-P4, P8, and F1/F2 proxy runs
    owner: operator
    next_action: run the minimum campaign and record its manifests before selecting a mixture or LR
  - entry_id: deferred.wikitext_slice
    category: organizer_answer
    requirement: exact WikiText-103 split, slice, normalization, context, stride, and denominator
    owner: operator
    next_action: send the Section 2.2 organizer questions and promote a new immutable protocol on reply
  - entry_id: deferred.teammate_eligibility
    category: personal_attestation
    requirement: both teammates confirm eligibility and Devpost registration
    owner: teammates
    next_action: each teammate confirms in their own name before submission
  - entry_id: deferred.public_artifacts
    category: public_release
    requirement: public repository, weights, video, and logged-out access checks
    owner: operator
    next_action: publish the artifacts and verify each from a logged-out session

reason_codes:
  ok:
    - AUDIT_OK
  fail_closed:
    - AUDIT_DEFERRAL_CATEGORY_INVALID
    - AUDIT_DEFERRAL_DETAIL_INCOMPLETE
    - AUDIT_DIGEST_DRIFT
    - AUDIT_INTEGRITY_VIOLATION
    - AUDIT_MUTATED_REPOSITORY
    - AUDIT_UNEXPLAINED_DIFFERENCE
    - AUDIT_VERIFIER_FAILED

counters:
  preserve_reason_coded_counts: true
  emit_per_entry: true
