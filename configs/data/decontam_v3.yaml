  quarantine:
    - BENCHMARK_ITEM_SUBSTRING
    - BENCHMARK_CONTIGUOUS_OVERLAP
    - BENCHMARK_SHINGLE_COVERAGE
  fail_closed: [BENCHMARK_REVISIONS_NOT_PINNED]

counters:
