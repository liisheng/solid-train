# Frozen v3 precision correction; v1 and v2 remain immutable historical evidence.
# The existing v2 index retains all normalized fields and shingles and is reusable.

protocol: decontamination
version: v3
frozen: true
calibration: planted-fixtures-plus-observed-v2-short-answer-failure
calibrated_before_real_corpus_scan: false
change_recorded_at: "2026-09-05T20:37:13+08:00"
supersedes: configs/data/decontam_v2.yaml
supersede_reason: >-
  The v2 scan quarantined every one of its first 7,767 documents because standalone
  benchmark answers such as 2, 4, and 8 triggered rule 1. Require at least 13 normalized
  words in a complete matched field, matching the existing shingle resolution. Keep
  benchmark inputs, normalization, and rules 2 and 3 unchanged. This is a documented
  precision correction after observing pipeline yield, before model training or scoring.

change_control:
  immutable: true
  on_change: create configs/data/decontam_v4.yaml and record the reason
  hash_algorithm: sha256
  hash_scope: file bytes with CRLF normalized to LF
  hash_registry: src/tinybench_lm/data_protocols.py::FROZEN_PROTOCOL_SHA256

limitations:
  - Standalone fields shorter than 13 normalized words do not trigger rule 1.
  - This does not certify absence of paraphrased contamination or copied short questions.
  - Short answers embedded in a qualifying longer copied prompt remain covered by that prompt.

matching_normalization:
  unicode_form: NFKC
  case: lowercase
  case_scope: matching_only
  whitespace: collapse_runs_to_single_space
  strip_ends: true
  preserve_stored_text: true
  must_equal: configs/data/dedup_v1.yaml::matching_normalization

quarantine_rules:
  - rule_id: RULE_1_COMPLETE_ITEM_SUBSTRING
    reason_code: BENCHMARK_ITEM_SUBSTRING
    definition: a complete normalized benchmark text field of at least 13 words occurs as a substring of the normalized document
    word_boundary_aligned: true
    minimum_item_words: 13
  - rule_id: RULE_2_LONGEST_CONTIGUOUS_OVERLAP
    reason_code: BENCHMARK_CONTIGUOUS_OVERLAP
    definition: longest contiguous run of normalized words shared by the document and one benchmark item
    unit: word
    minimum_words: 50
    threshold_comparison: greater_or_equal
  - rule_id: RULE_3_SHINGLE_COVERAGE
    reason_code: BENCHMARK_SHINGLE_COVERAGE
    definition: distinct benchmark shingles matched in the document covering a fraction of the document words
    shingle_unit: word
    shingle_size: 13
    minimum_distinct_shingles: 3
    minimum_document_word_coverage: 0.10
    coverage_denominator: normalized_document_word_count
    coverage_numerator: distinct document word positions covered by matched shingles
    threshold_comparison: greater_or_equal

decision:
  rule_evaluation_order: [RULE_1_COMPLETE_ITEM_SUBSTRING, RULE_2_LONGEST_CONTIGUOUS_OVERLAP, RULE_3_SHINGLE_COVERAGE]
  primary_reason_code: first_rule_that_fires_in_declared_order
  all_matched_rules_recorded: true
  action_on_match: QUARANTINE
  clean_reason_code: CLEAN
  fail_closed: true

boundary_review:
  contiguous_overlap_band_words: 5
  shingle_coverage_band: 0.02
  sample_per_band: 20
  sample_selection: lowest_document_id_first
  reason_code: BOUNDARY_REVIEW_SAMPLE

