    status: PASS
    evidence: Hugging Face dataset API commit SHAs and GitHub refs/heads/main resolved on the pinned date
    splits_required_in_decontamination: all_available
  secondary_results_may_influence_training: false

readiness:
  real_corpus_scan_requires_all_revisions_pinned: true
  fixture_calibration_allowed_while_blocked: true
  real_corpus_scan_status: READY

reason_codes:
