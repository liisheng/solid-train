# Frozen source registry, manifest schema, and allow/deny corpus policy
# (Plan Sections 4.1-4.5, 5.2, 11.2), aligned to the published Track 01 rules.
#
# FROZEN: this file is pinned by a SHA-256 digest in
# src/tinybench_lm/source_manifest.py (FROZEN_CORPUS_PROTOCOL_SHA256). Loading fails
# closed if the bytes change. Any change must be published as configs/data/sources_v3.yaml
# with a recorded reason; never edit v2 in place.
#
# ---------------------------------------------------------------------------------------
# WHY THIS SUPERSEDES v1
# ---------------------------------------------------------------------------------------
# v1 was written before the Track 01 rules text was available, and it was stricter than the
# rules require in one respect that blocked all corpus work: it demanded a recorded
# *per-title licence review* for OpenStax and narrative titles.
#
# The published rule is narrower:
#
#   "you may use existing public datasets (FineWeb, TinyStories, The Pile and similar) ...
#    Credit everything you use in Built With and your README."
#
# The obligation is attribution, not a per-title licence audit. v2 therefore replaces
# `license_review` with `attribution`, which records each source's declared licence from its
# dataset card and requires it be credited in Built With and the README. That is exactly
# what the rules ask for, and it is checkable.
#
# v2 also pins the source revisions that v1 left as PENDING_PIN. Pinning is NOT a rules
# requirement -- it is kept because a manifest that records raw_sha256 and accepted token
# counts is only reproducible against an immutable revision, and the rules do require
# reporting approximate compute, which is derived from those counts.
#
# WHAT DID NOT CHANGE, DELIBERATELY:
#
# The synthetic-text prohibition stays, even though the rules list TinyStories as permitted.
# The same rules paragraph says "You may not ... distill from a larger model", and TinyStories
# is generated by a larger model; training on it is open to being read as distillation. The
# rules are in tension with themselves there, judges may disqualify for track violations, and
# the upside of synthetic narrative text is small. Staying conservative costs little and
# removes an argument we could not win. The full-Pile prohibition also stays, on the original
# quality-and-licensing-complexity grounds rather than any rule.

protocol: sources
version: v2
frozen: true
calibration: planted-fixtures-only
calibrated_before_real_corpus_acquisition: true
supersedes: configs/data/sources_v1.yaml
supersede_reason: >-
  v1 required a per-title licence review that the published Track 01 rules do not ask for,
  which blocked all corpus acquisition. The rules require crediting every dataset used in
  Built With and the README. v2 records each source's declared licence and requires that
  attribution, and pins the source revisions v1 left unpinned.

change_control:
  immutable: true
  on_change: create configs/data/sources_v3.yaml and record the reason
  hash_algorithm: sha256
  hash_scope: file bytes with CRLF normalized to LF
  hash_registry: src/tinybench_lm/source_manifest.py::FROZEN_CORPUS_PROTOCOL_SHA256

# --------------------------------------------------------------------------------------
# Streaming document record / manifest schema (Plan Section 5.2 last bullet)
# --------------------------------------------------------------------------------------

manifest_schema:
  format: jsonl
  streaming: true
  one_record_per_document: true
  deterministic_order: sort_by_source_id_then_document_id
  required_fields:
    - source_id
    - revision
    - document_id
    - url
    - url_status
    - raw_sha256
    - license
    - boundary
    - action
    - reason_code
    - filter_decisions
    - accepted_token_count
    - token_counter_id
  raw_hash:
    algorithm: sha256
    scope: original_document_utf8_bytes
    computed_before_any_filter: true
    preserve_stored_text: true
  document_id:
    stability: stable across reruns of the same pinned revision
    required: true
  url:
    record_when_publication_permitted: true
    withheld_status: WITHHELD_BY_SOURCE_POLICY
    absent_status: NOT_PROVIDED_BY_SOURCE
    present_status: RECORDED
  license:
    required: true
    # The per-record licence is the source's declared licence, inherited from the pinned
    # revision. Per-document review is not required by the rules.
    inherited_from_source_revision: true
    unrecorded_reason_code: REJECT_LICENSE_NOT_RECORDED
  filter_decisions:
    record_every_evaluated_filter: true
    record_measurement: true
    primary_reason_code: first_failing_filter_in_declared_evaluation_order
  accepted_token_count:
    required_for: accepted_records_only
    must_be_positive_integer: true
    rejected_records_value: null
    measured_with: final_tokenizer
    final_measurement_status: DEFERRED
    blocker: the final 12,288-ID tokenizer does not exist yet (Plan Section 5.3)
    owner: operator
    next_action: rebuild every manifest with the final tokenizer before the G1 mixture reconciliation
    provisional_counter_id: provisional_whitespace_words
    final_counter_id: final_tokenizer_v1

# --------------------------------------------------------------------------------------
# Allowed stable sources (Plan Section 4.1). Shares are post-filter token shares
# measured with the final tokenizer. Revisions are pinned Hugging Face dataset commits.
# --------------------------------------------------------------------------------------

stable_sources:
  - source_id: fineweb_edu
    boundary: stable_train
    purpose: educational and explanatory English
    dataset: FineWeb-Edu
    huggingface_repo: HuggingFaceFW/fineweb-edu
    intended_revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
    revision_pinned: true
    revision_recorded_on: "2026-08-31"
    stable_share: 0.70
    target_tokens_at_11b: 7700000000
    declared_license: ODC-By 1.0
    license_source: "dataset card metadata field `license: odc-by`"
    attribution_required: true
    per_document_license_required: false
    url_publication_permitted: true
    prose_profile: general
  - source_id: dclm
    boundary: stable_train
    purpose: general-language diversity
    dataset: DCLM Baseline 1.0
    huggingface_repo: mlfoundations/dclm-baseline-1.0
    intended_revision: a3b142c183aebe5af344955ae20836eb34dcf69b
    revision_pinned: true
    revision_recorded_on: "2026-08-31"
    stable_share: 0.20
    target_tokens_at_11b: 2200000000
    declared_license: CC BY 4.0
    license_source: "dataset card metadata field `license: cc-by-4.0`"
    attribution_required: true
    per_document_license_required: false
    url_publication_permitted: true
    prose_profile: general
  - source_id: openwebmath
    boundary: stable_train
    purpose: mathematical and scientific explanations
    dataset: OpenWebMath, prose-filtered
    huggingface_repo: open-web-math/open-web-math
    intended_revision: fde8ef8de2300f5e778f56261843dab89f230815
    revision_pinned: true
    revision_recorded_on: "2026-08-31"
    stable_share: 0.07
    target_tokens_at_11b: 770000000
    # The card carries no `license:` metadata field, so the licence must be read from the
    # card prose and recorded before this source is accepted. This is the one stable source
    # whose licence is not a machine-readable fact.
    declared_license: READ_FROM_CARD_PROSE
    license_source: dataset card prose, not metadata
    license_status: PENDING_CARD_READ
    attribution_required: true
    per_document_license_required: false
    url_publication_permitted: true
    prose_profile: openwebmath
  - source_id: narrative
    boundary: stable_train
    purpose: long-form continuation and co-reference
    dataset: US public-domain books
    huggingface_repo: storytracer/US-PD-Books
    intended_revision: 01f85b67ba15cc3275e36d84ff51b23c90ce190a
    revision_pinned: true
    revision_recorded_on: "2026-08-31"
    stable_share: 0.03
    target_tokens_at_11b: 330000000
    # CC0 has no attribution obligation, but the dataset is credited anyway because the
    # rules require crediting everything used.
    declared_license: CC0 1.0
    license_source: "dataset card metadata field `license: cc0-1.0`"
    attribution_required: true
    per_document_license_required: false
    url_publication_permitted: true
    prose_profile: narrative
    substitution_note: >-
      v1 named "public-domain narrative, preferably licensed Common Pile Gutenberg" with a
      per-title licence requirement. A CC0 corpus removes per-title variance entirely while
      serving the same purpose, and is human-written rather than model-generated.

