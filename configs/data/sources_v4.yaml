# Frozen source registry, manifest schema, and allow/deny corpus policy
# (Plan Sections 4.1-4.5, 5.2, 11.2), aligned to the published Track 01 rules.
#
# FROZEN: this file is pinned by a SHA-256 digest in
# src/tinybench_lm/source_manifest.py (FROZEN_CORPUS_PROTOCOL_SHA256). Loading fails
# closed if the bytes change. Any change must be published as configs/data/sources_v5.yaml
# with a recorded reason; never edit v4 in place.
#
# ---------------------------------------------------------------------------------------
# WHY THIS SUPERSEDES v3
# ---------------------------------------------------------------------------------------
# Two sources in v3 could not actually be read. Both were registered on licence metadata
# without streaming a row to confirm they carried usable text, and both were caught by a
# pre-draw availability check before any tokenizer was built on them.
#
#   narrative / storytracer/US-PD-Books
#     Contains no text. Its schema is a catalogue -- ocaid, title, author, year, page_count,
#     openlibrary_edition, openlibrary_work, full_text_url -- and the book text lives at
#     archive.org behind those URLs. Registering it as a text source was an error.
#     Replaced by sedthh/gutenberg_english (MIT), verified streaming with a `TEXT` column.
#
#   dclm / mlfoundations/dclm-baseline-1.0
#     Cannot be read in the pinned environment: "Compression type zstd not supported". The
#     `zstandard` package is absent from constraints/verified-py311-windows.txt and from
#     pyproject.toml, and adding a dependency to satisfy one source would change the verified
#     environment. Replaced by HuggingFaceFW/fineweb (ODC-By), which v1's own registry text
#     already anticipated as "an approved general FineWeb fallback", needs no new dependency,
#     and shares FineWeb-Edu's licence and tooling.
#
# Every source in v4 has been streamed at its pinned revision and confirmed to yield text.
# Note that gutenberg_english exposes its text column as `TEXT`, not `text`.
#
# The lesson recorded for the next version: a licence check is not an availability check.
# Registering a source requires streaming one document from the pinned revision and
# confirming a non-empty text field.

protocol: sources
version: v4
frozen: true
calibration: planted-fixtures-only
calibrated_before_real_corpus_acquisition: true
supersedes: configs/data/sources_v3.yaml
supersede_reason: >-
  Two v3 sources could not be read: storytracer/US-PD-Books carries no text (it is a
  catalogue of archive.org URLs) and mlfoundations/dclm-baseline-1.0 requires the unpinned
  zstandard package. Both were registered on licence metadata without an availability check.
  v4 replaces them with sedthh/gutenberg_english and HuggingFaceFW/fineweb, each streamed at
  its pinned revision and confirmed to yield text.
supersede_chain: [configs/data/sources_v1.yaml, configs/data/sources_v2.yaml, configs/data/sources_v3.yaml]

change_control:
  immutable: true
  on_change: create configs/data/sources_v5.yaml and record the reason
  hash_algorithm: sha256
  hash_scope: file bytes with CRLF normalized to LF
  hash_registry: src/tinybench_lm/source_manifest.py::FROZEN_CORPUS_PROTOCOL_SHA256

# --------------------------------------------------------------------------------------
# Streaming document record / manifest schema (Plan Section 5.2 last bullet)
# --------------------------------------------------------------------------------------

manifest_schema:
  format: jsonl
  streaming: true
  one_record_per_document: true
  deterministic_order: sort_by_source_id_then_document_id
  required_fields:
    - source_id
    - revision
    - document_id
    - url
    - url_status
    - raw_sha256
    - license
    - boundary
    - action
    - reason_code
    - filter_decisions
    - accepted_token_count
    - token_counter_id
  raw_hash:
    algorithm: sha256
    scope: original_document_utf8_bytes
    computed_before_any_filter: true
    preserve_stored_text: true
  document_id:
    stability: stable across reruns of the same pinned revision
    required: true
  url:
    record_when_publication_permitted: true
    withheld_status: WITHHELD_BY_SOURCE_POLICY
    absent_status: NOT_PROVIDED_BY_SOURCE
    present_status: RECORDED
  license:
    required: true
    # The per-record licence is the source's declared licence, inherited from the pinned
    # revision. Per-document review is not required by the rules.
    inherited_from_source_revision: true
    unrecorded_reason_code: REJECT_LICENSE_NOT_RECORDED
  filter_decisions:
    record_every_evaluated_filter: true
    record_measurement: true
    primary_reason_code: first_failing_filter_in_declared_evaluation_order
  accepted_token_count:
    required_for: accepted_records_only
    must_be_positive_integer: true
    rejected_records_value: null
    measured_with: final_tokenizer
    final_measurement_status: DEFERRED
    blocker: the final 12,288-ID tokenizer does not exist yet (Plan Section 5.3)
    owner: operator
    next_action: rebuild every manifest with the final tokenizer before the G1 mixture reconciliation
    provisional_counter_id: provisional_whitespace_words
    final_counter_id: final_tokenizer_v1

