# --------------------------------------------------------------------------------------
# Deny policy (Plan Sections 4.5 and 11.2). A candidate is rejected when its source
# identity or declared provenance matches any category below. Unchanged from v1 except
# for the recorded reasoning on synthetic text.
# --------------------------------------------------------------------------------------

prohibited_categories:
  - policy_id: PROHIBITED_SYNTHETIC_TEXT
    description: synthetic stories, generated instruction data, or hosted-model-generated corpus text
    # Kept despite the rules listing TinyStories as permitted: the same rules paragraph
    # forbids distilling from a larger model, and model-generated corpora are open to being
    # read as exactly that. Conservative by choice, and recorded as a choice.
    retained_against_permissive_rule: true
    retention_reason: >-
      the Track 01 rules permit TinyStories but also forbid distilling from a larger model;
      training on model-generated text is open to a distillation reading, and judges may
      disqualify for track violations
    match_source_ids: [synthetic_stories, generated_instructions, hosted_model_corpus, synthetic_textbooks]
    match_provenance_flags: [synthetic, generated_text, hosted_model_generated, model_written]
  - policy_id: PROHIBITED_MODEL_DERIVED_SUPERVISION
    description: logits, probabilities, rankings, or hidden states copied from another model
    match_source_ids: [model_logit_dump, model_ranking_dump, hidden_state_dump]
    match_provenance_flags: [model_logits, model_probabilities, model_rankings, model_hidden_states, model_supervision]
  - policy_id: PROHIBITED_BENCHMARK_EXAMPLES
    description: official benchmark examples used as training material
    match_source_ids: [hellaswag_train, arc_train, piqa_train, winogrande_train, benchmark_examples]
    match_provenance_flags: [benchmark_example, benchmark_split]
  - policy_id: PROHIBITED_BENCHMARK_TARGETED
    description: benchmark-targeted retrieval or generated examples
    match_source_ids: [benchmark_targeted_retrieval, benchmark_targeted_generation]
    match_provenance_flags: [benchmark_targeted, benchmark_retrieval]
  - policy_id: PROHIBITED_LARGE_CODE_CORPUS
    description: large code corpora
    match_source_ids: [the_stack, github_code, codeparrot, starcoderdata]
    match_provenance_flags: [large_code_corpus]
  - policy_id: PROHIBITED_RAW_COMMON_CRAWL
    description: unfiltered raw Common Crawl
    match_source_ids: [common_crawl_raw, cc_wet_raw, cc_warc_raw]
    match_provenance_flags: [raw_common_crawl, unfiltered_crawl]
  - policy_id: PROHIBITED_FULL_PILE
    description: the full Pile, whose quality and licensing complexity is unnecessary here
    retained_against_permissive_rule: true
    retention_reason: >-
      the rules permit the Pile; it is excluded on quality and licensing-complexity grounds
      only, and this exclusion may be revisited if the corpus needs volume
    match_source_ids: [pile_full, the_pile]
    match_provenance_flags: [full_pile]
  - policy_id: PROHIBITED_HOSTED_MODEL_ANNOTATION
    description: a hosted model used to label, rewrite, or score training documents
    # The rules permit sponsor APIs for "data processing". This stays prohibited for the
    # training corpus specifically, because a hosted model shaping which documents are kept
    # imprints that model on the corpus. Sponsor APIs remain available for tooling and
    # evaluation, which is where the rules point them.
    retained_against_permissive_rule: true
    retention_reason: >-
      the rules allow sponsor APIs for data processing; excluded here for corpus selection
      and rewriting only, to keep the training data free of hosted-model influence
    match_source_ids: [hosted_model_labeled, hosted_model_rewritten, hosted_model_scored]
    match_provenance_flags: [hosted_model_labeled, hosted_model_rewritten, hosted_model_scored, hosted_model_filtered]

deny_policy:
  reason_code: REJECT_PROHIBITED_SOURCE
  unregistered_source_reason_code: REJECT_SOURCE_NOT_ALLOWED
  allow_list_is_exhaustive: true
  fail_closed: true

# --------------------------------------------------------------------------------------
# Acquisition readiness
# --------------------------------------------------------------------------------------

# A licence check is not an availability check. v3 registered two sources that could not be
# read -- one carrying no text at all -- because only their licence metadata was inspected.
availability_policy:
  status: PASS
  requirement: >-
    every registered source must be streamed at its pinned revision and confirmed to yield a
    non-empty text field before it is accepted into the registry
  checked_on: "2026-08-31"
  evidence_field: availability_evidence
  text_column_recorded: true
  text_column_note: sedthh/gutenberg_english exposes TEXT in uppercase, unlike every other source
  reason_code_on_unchecked_source: REJECT_SOURCE_NOT_AVAILABILITY_CHECKED

revision_pinning:
  status: PASS
  evidence: >-
    every stable and reserved source names an immutable Hugging Face dataset commit,
    recorded 2026-08-31 from the Hub API; derived reserved sources inherit their parent's
    pinned revision
  pinned_sources: 9
  per_document_revision_required: true
  unpinned_reason_code: REJECT_UNPINNED_REVISION

# Replaces v1's `license_review`. The rules require crediting datasets, not auditing titles.
license_review:
  status: PASS
  standard: credit_in_built_with_and_readme
  rule_text: >-
    "You may use existing public datasets ... Credit everything you use in Built With and
    your README."
  evidence: >-
    each source records declared_license and license_source from its dataset card; no
    per-title review is required by the rules
  per_title_review_required: false
  superseded_from_v1: >-
    v1 required a per-title licence review for OpenStax and narrative titles, which the
    rules do not ask for and which blocked all corpus acquisition
  outstanding: []
  resolved_in_v3:
    - source_id: openwebmath
      was: PENDING_CARD_READ
      now: ODC-By 1.0 recorded from the card front matter and License section
    - source_id: reserved_math_prose
      was: PENDING_CARD_READ
      now: ODC-By 1.0 inherited from the pinned openwebmath revision

# The attribution obligation itself is a release artifact and has not been produced.
attribution:
  requirement: every dataset used is credited in Built With and the README
  # The README half is a repository fact and is done. The Devpost half is a submission action
  # nobody has taken, so it stays NOT_RUN rather than being folded into a single PASS.
  readme_credits:
    status: PASS
    path: README.md
    section: Credits
    evidence: >-
      every stable and reserved source is listed with its licence and pinned revision, the
      Common Crawl and share-alike obligations are stated, and the prohibited categories are
      named as not used
  built_with_template:
    status: PASS
    path: docs/templates/BUILT_WITH.md
    evidence: the dataset table is filled with real licences and pinned revisions
  built_with_submitted:
    status: NOT_RUN
    owner: operator
    next_action: copy the Built With table into the Devpost submission before the deadline

readiness:
  real_corpus_acquisition_requires_pinned_revisions: true
  fixture_calibration_allowed_while_blocked: true
  measured_removal_rates: NOT_RUN
  measured_accepted_tokens: NOT_RUN

reason_codes:
  accept:
    - ACCEPTED
  reject:
    - REJECT_SOURCE_NOT_ALLOWED
    - REJECT_PROHIBITED_SOURCE
    - REJECT_MISSING_PROVENANCE
    - REJECT_LICENSE_NOT_RECORDED
    - REJECT_UNPINNED_REVISION
    - REJECT_EMPTY
    - REJECT_BINARY
    - REJECT_MALFORMED
    - REJECT_TOO_SHORT
    - REJECT_TOO_LONG
    - REJECT_CREDENTIAL_LIKE
    - REJECT_CONTACT_DUMP
    - REJECT_NOT_ENGLISH
    - REJECT_FORMULA_ONLY
    - REJECT_TEX_DUMP
    - REJECT_ANSWER_LIST
    - REJECT_MARKUP_DOMINATED
  fail_closed:
    - SOURCE_REVISIONS_NOT_PINNED

counters:
  preserve_reason_coded_counts: true
  emit_per_source: true
