[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinybench-lm"
version = "0.1.0"
description = "A reproducible, benchmark-oriented language model under 50M parameters"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "lm-eval>=0.4.12",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tokenizers>=0.20",
  "torch>=2.5",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
